    <script>try { const saved = JSON.parse(localStorage.getItem('studyroom.v1') || '{}').settings || {}; const landingTheme = localStorage.getItem('studyroom.landing.theme'); const dark = saved.dark === undefined ? (landingTheme ? landingTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) : !!saved.dark; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; const palette = saved.theme === 'sunset' ? 'warm-beige-chocolate' : saved.theme; document.documentElement.dataset.palette = palette || 'midnight'; } catch { document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.palette = 'midnight'; }</script>
