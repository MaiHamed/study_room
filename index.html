<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport"
      content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f5ee"><title>Studyroom — your study
      space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link
      rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="https://unpkg.com/lucide@1.69.0/dist/umd/lucide.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], processEscapes: true }, options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }, chtml: { scale: 1 } };</script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  </head>
  <body><div class="app-shell"><aside class="sidebar">
        <a class="brand" href="#dashboard"><span class="brand-mark">✳</span><span>studyroom<small>YOUR PERSONAL STUDY
              SPACE</small></span></a>
        <div class="side-label">WORKSPACE</div><nav id="nav"></nav>
        <div class="side-bottom"><div class="streak"><span><i data-lucide="flame"></i></span><div><b
                id="side-streak">0 day streak</b><small>Little by little, every
                day.</small></div></div><button class="theme-btn"
            id="theme-toggle"><i data-lucide="sun-moon" aria-hidden="true"></i><span>Switch appearance</span></button></div>
      </aside><main class="main"><header class="topbar"><button id="mobile-menu"
            class="icon-btn mobile-only" aria-label="Open menu"><i data-lucide="menu" aria-hidden="true"></i></button><div
            class="crumb" id="crumb">Your overview</div><div
            class="top-actions"><div class="today" id="today"></div><button
              class="avatar"
              data-page="profile" aria-label="Edit profile" title="Edit profile"></button></div></header><section
          id="view" class="view"></section></main></div><div id="toast"
      class="toast" role="status"></div><div id="modal-root"></div><script
      src="js/app.js"></script></body></html>
